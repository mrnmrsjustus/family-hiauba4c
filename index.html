<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Justus Family Guestbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --hero:#6B8A63; --hero-deep:#56724F; --paper:#FBFBF7; --ink:#1D2A22; --muted:#5A675E; --line:#DCE2D6;
  --blue:#1E3A8A; --green:#2B7A55; --sage:#5E7E54; --err:#A43A2F;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--hero);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;place-items:center;min-height:100vh}
.book{width:100%;max-width:520px;background:var(--paper);border-radius:22px;box-shadow:0 24px 60px rgba(20,35,25,.28);overflow:hidden}
.spine{height:12px;background:repeating-linear-gradient(90deg,var(--blue) 0 33.3%,var(--green) 33.3% 66.6%,var(--sage) 66.6% 100%)}
.inner{padding:36px 32px 30px}
@media (max-width:440px){.inner{padding:28px 20px 24px}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,44px);line-height:1;margin:8px 0 10px;letter-spacing:-.02em;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 24px}
form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.row{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
label span.opt{font-weight:400;color:var(--muted)}
input,textarea{font:inherit;font-size:17px;color:var(--ink);background:#fff;border:1px solid var(--line);border-bottom:2px solid #C9D2C2;border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(43,122,85,.18)}
button{font:600 17px/1 var(--body);color:#fff;background:var(--green);border:0;border-radius:12px;padding:15px 18px;cursor:pointer;margin-top:4px}
button:hover{background:#246848}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button[disabled]{opacity:.65;cursor:progress}
.msg{min-height:1.4em;margin:2px 0 0;font-size:15px}
.msg.err{color:var(--err)}
.msg.ok{color:var(--green)}
.foot{margin:22px 0 0;padding-top:16px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.book{animation:rise .5s ease both}@keyframes rise{from{transform:translateY(10px);opacity:.6}}}
</style>
</head>
<body>
<main class="book">
  <div class="spine" aria-hidden="true"></div>
  <div class="inner">
    <p class="eyebrow">The Justus Family · 2026</p>
    <h1>Sign our guestbook</h1>
    <p class="lede">Thanks for stopping by! Sign in to see our year.</p>
    <form id="gb" autocomplete="on" novalidate>
      <div class="row">
        <label for="first">First name<input id="first" name="first" autocomplete="given-name" required></label>
        <label for="last">Last name<input id="last" name="last" autocomplete="family-name" required></label>
      </div>
      <label for="note">Leave us a note <span class="opt">(optional)</span><textarea id="note" name="note" maxlength="500"></textarea></label>
      <button id="go" type="submit">Sign the guestbook</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="foot">With love from Nick, Joanna &amp; JR</p>
  </div>
</main>

const FORM = { url: "", first: "", last: "", note: "" }; // Google Form (filled in later)

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z]/g, "");
const msg = (t, cls) => { const m = document.getElementById("msg"); m.textContent = t; m.className = "msg " + (cls || ""); };

async function unwrap(last){
  const base = await crypto.subtle.importKey("raw", enc.encode(norm(last)), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(CFG.salt), iterations:CFG.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  for (const w of CFG.wraps){
    try {
      const raw = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(w.iv)}, kek, b64(w.ct));
      return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    } catch(e) {}
  }
  return null;
}
async function decryptFile(key, path){
  const buf = new Uint8Array(await (await fetch(path, {cache:"no-cache"})).arrayBuffer());
  return crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, key, buf.slice(12));
}
async function openSite(key){
  let html = dec.decode(await decryptFile(key, CFG.page));
  const entries = Object.entries(CFG.photos);
  const urls = await Promise.all(entries.map(async ([orig, file]) => {
    const type = orig.endsWith(".png") ? "image/png" : "image/jpeg";
    return URL.createObjectURL(new Blob([await decryptFile(key, file)], {type}));
  }));
  entries.forEach(([orig], i) => { html = html.split('"' + orig + '"').join('"' + urls[i] + '"'); });
  document.open(); document.write(html); document.close();
}
function log(first, last, note){
  if (!FORM.url) return;
  try {
    const d = new FormData(); d.append(FORM.first, first); d.append(FORM.last, last); d.append(FORM.note, note);
    fetch(FORM.url, {method:"POST", mode:"no-cors", body:d}).catch(()=>{});
  } catch(e) {}
}

document.getElementById("gb").addEventListener("submit", async e => {
  e.preventDefault();
  const first = document.getElementById("first").value.trim();
  const last = document.getElementById("last").value.trim();
  const note = document.getElementById("note").value.trim();
  if (!first || !last){ msg("Please add your first and last name.", "err"); return; }
  const btn = document.getElementById("go"); btn.disabled = true; msg("Checking the guest list…");
  try {
    const key = (await unwrap(last)) || (await unwrap(first));
    if (!key){ msg("We couldn't find you on our guest list. Reach out to Joanna or Nick and we'll add you!", "err"); btn.disabled = false; return; }
    log(first, last, note);
    try { localStorage.setItem("jf-guest", (await unwrap(last)) ? last : first); } catch(e) {}
    msg("Welcome, " + first + "! Opening our year…", "ok");
    await openSite(key);
  } catch(err){
    msg("Something went wrong loading the page. Please try again.", "err"); btn.disabled = false;
  }
});

(async () => {
  let saved = null; try { saved = localStorage.getItem("jf-guest"); } catch(e) {}
  if (!saved) return;
  try { const key = await unwrap(saved); if (key) await openSite(key); } catch(e) {}
})();
</script>
